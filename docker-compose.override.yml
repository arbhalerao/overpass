services:
  backend:
    environment:
      APP_ENV: development
      LOG_FORMAT: console
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/app:/app/app:ro
      - astronomy-data:/app/data
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app

  frontend:
    build:
      target: development
    environment:
      BACKEND_ORIGIN: http://backend:8000
      HMR_CLIENT_PORT: ${FRONTEND_PORT:-51800}
      CHOKIDAR_USEPOLLING: "1"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
    ports: !override
      - "${FRONTEND_PORT:-51800}:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
